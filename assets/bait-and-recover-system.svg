<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Bait-and-Recover system overview</title>
  <desc id="desc">Heretic estimates refusal directions from internal activations and searches over edit configurations. Bait-and-Recover distorts the observable readout while Recover restores downstream model behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #475569; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #64748B; }
      .pill { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
      .box { filter: url(#shadow); rx: 18; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="52" y="58" class="title">Bait-and-Recover: observation-behavior decoupling</text>
  <text x="52" y="86" class="subtitle">The attacker can inspect weights and activations, but the measured refusal signal is made unreliable for low-distortion editing.</text>

  <rect x="52" y="122" width="1096" height="190" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="78" y="156" class="label" fill="#9A3412">White-box editing jailbreak pipeline</text>
  <text x="78" y="179" class="small">Heretic is not a fixed one-layer edit: it searches directions, layers, modules, signs, and edit scales.</text>

  <rect class="box" x="82" y="212" width="150" height="62" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="157" y="238" text-anchor="middle" class="label">Open-weight</text>
  <text x="157" y="259" text-anchor="middle" class="small">checkpoint</text>

  <rect class="box" x="292" y="206" width="170" height="74" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="377" y="234" text-anchor="middle" class="label">Internal</text>
  <text x="377" y="255" text-anchor="middle" class="small">refusal readout</text>

  <rect class="box" x="522" y="194" width="220" height="98" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="632" y="222" text-anchor="middle" class="label">Heretic search</text>
  <text x="632" y="246" text-anchor="middle" class="small">200 trials over layer / module</text>
  <text x="632" y="266" text-anchor="middle" class="small">scope / sign / scale</text>

  <rect class="box" x="802" y="206" width="150" height="74" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="877" y="235" text-anchor="middle" class="label">Projection</text>
  <text x="877" y="256" text-anchor="middle" class="small">weight edit</text>

  <rect class="box" x="1008" y="206" width="110" height="74" fill="#FFE4E6" stroke="#FB7185"/>
  <text x="1063" y="235" text-anchor="middle" class="label">Low-refusal</text>
  <text x="1063" y="256" text-anchor="middle" class="small">derivative</text>

  <line x1="232" y1="243" x2="292" y2="243" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="462" y1="243" x2="522" y2="243" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="742" y1="243" x2="802" y2="243" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="952" y1="243" x2="1008" y2="243" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <rect x="52" y="348" width="1096" height="218" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="78" y="382" class="label" fill="#1D4ED8">Bait-and-Recover defense</text>
  <text x="78" y="405" class="small">Bait changes what the attacker measures; Recover restores the behavior path before downstream computation.</text>

  <rect class="box" x="82" y="448" width="132" height="62" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="148" y="484" text-anchor="middle" class="label">Input</text>

  <rect class="box" x="274" y="438" width="146" height="82" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="347" y="468" text-anchor="middle" class="label">Bait</text>
  <text x="347" y="490" text-anchor="middle" class="small">merged adapter</text>

  <rect class="box" x="488" y="428" width="178" height="102" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="577" y="461" text-anchor="middle" class="label">Distorted</text>
  <text x="577" y="482" text-anchor="middle" class="small">residual / readout</text>
  <text x="577" y="505" text-anchor="middle" class="tiny">visible to attacker</text>

  <rect class="box" x="744" y="438" width="150" height="82" fill="#DCFCE7" stroke="#34D399"/>
  <text x="819" y="468" text-anchor="middle" class="label">Recover</text>
  <text x="819" y="490" text-anchor="middle" class="small">restore behavior</text>

  <rect class="box" x="956" y="448" width="142" height="62" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1027" y="474" text-anchor="middle" class="label">Normal</text>
  <text x="1027" y="495" text-anchor="middle" class="small">safe output</text>

  <path d="M214 479 H274" stroke="#2563EB" stroke-width="2.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M420 479 H488" stroke="#2563EB" stroke-width="2.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M666 479 C694 479, 706 479, 744 479" stroke="#059669" stroke-width="2.8" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M894 479 H956" stroke="#059669" stroke-width="2.8" fill="none" marker-end="url(#arrow-green)"/>

  <path d="M577 428 C577 370, 632 341, 632 294" stroke="#E11D48" stroke-width="2.2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow-red)"/>
  <text x="676" y="354" class="small" fill="#BE123C">attacker estimates a misleading direction</text>

  <rect x="508" y="548" width="414" height="34" rx="17" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="715" y="570" text-anchor="middle" class="pill" fill="#1D4ED8">merged weights · no runtime wrapper · low clean-behavior divergence</text>
</svg>
